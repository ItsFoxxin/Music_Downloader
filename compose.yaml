name: fox-den-media

x-build: &foxden-build
  context: ./music/backend
  args:
    APP_UID: "${PUID:-10001}"
    APP_GID: "${PGID:-10001}"

x-environment: &foxden-environment
  APP_ENVIRONMENT: "${APP_ENVIRONMENT:-production}"
  CONFIG_DIR: /config
  STAGING_DIR: /staging
  DATABASE_URL: sqlite:////config/foxden-music.db
  LOG_LEVEL: "${LOG_LEVEL:-INFO}"
  FILE_UMASK: "${FILE_UMASK:-0027}"
  MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-4294967296}"
  UPLOAD_CHUNK_BYTES: "${UPLOAD_CHUNK_BYTES:-1048576}"
  ARCHIVE_MAX_FILES: "${ARCHIVE_MAX_FILES:-2000}"
  ARCHIVE_MAX_TOTAL_BYTES: "${ARCHIVE_MAX_TOTAL_BYTES:-8589934592}"
  ARCHIVE_MAX_ENTRY_BYTES: "${ARCHIVE_MAX_ENTRY_BYTES:-2147483648}"
  ARCHIVE_MAX_COMPRESSION_RATIO: "${ARCHIVE_MAX_COMPRESSION_RATIO:-250}"
  FFPROBE_PATH: ffprobe
  FFPROBE_TIMEOUT_SECONDS: "${FFPROBE_TIMEOUT_SECONDS:-90}"
  FFMPEG_PATH: ffmpeg
  FFMPEG_TIMEOUT_SECONDS: "${FFMPEG_TIMEOUT_SECONDS:-180}"
  MUSICBRAINZ_CONTACT: "${MUSICBRAINZ_CONTACT:-}"
  MUSICBRAINZ_BASE_URL: "${MUSICBRAINZ_BASE_URL:-https://musicbrainz.org/ws/2}"
  COVER_ART_BASE_URL: "${COVER_ART_BASE_URL:-https://coverartarchive.org}"
  METADATA_HTTP_TIMEOUT_SECONDS: "${METADATA_HTTP_TIMEOUT_SECONDS:-20}"
  METADATA_CACHE_DAYS: "${METADATA_CACHE_DAYS:-30}"
  AUTOMATIC_MATCH_THRESHOLD: "${AUTOMATIC_MATCH_THRESHOLD:-94}"
  AUTOMATIC_MATCH_MARGIN: "${AUTOMATIC_MATCH_MARGIN:-8}"
  MAX_RELEASE_CANDIDATES: "${MAX_RELEASE_CANDIDATES:-5}"
  MAX_ARTWORK_BYTES: "${MAX_ARTWORK_BYTES:-26214400}"
  MAX_ARTWORK_PIXELS: "${MAX_ARTWORK_PIXELS:-40000000}"
  SPOTIDOWNLOADER_URL: "${SPOTIDOWNLOADER_URL:-https://spotidownloader.com/}"
  SPOTIFY_BATCH_MAX_URLS: "${SPOTIFY_BATCH_MAX_URLS:-100}"
  SPOTIFY_BATCH_MAX_CHARACTERS: "${SPOTIFY_BATCH_MAX_CHARACTERS:-20000}"
  DOWNLOAD_INBOX_DIR: "${DOWNLOAD_INBOX_DIR:-/downloads}"
  DOWNLOAD_INBOX_SETTLE_SECONDS: "${DOWNLOAD_INBOX_SETTLE_SECONDS:-30}"
  DOWNLOAD_INBOX_MIN_BYTES: "${DOWNLOAD_INBOX_MIN_BYTES:-1048576}"
  DOWNLOAD_INBOX_RECURSIVE: "${DOWNLOAD_INBOX_RECURSIVE:-true}"
  DOWNLOAD_INBOX_MAX_FILES: "${DOWNLOAD_INBOX_MAX_FILES:-200}"
  DOWNLOAD_INBOX_MOVE_FILES: "${DOWNLOAD_INBOX_MOVE_FILES:-true}"
  DOWNLOAD_INBOX_AUTO_IMPORT: "${DOWNLOAD_INBOX_AUTO_IMPORT:-true}"
  # The browser shares the application's address through the gateway.
  REMOTE_BROWSER_URL: /server-browser/

x-service: &foxden-service
  image: fox-den-music:2.3.4
  build: *foxden-build
  user: "${PUID:-10001}:${PGID:-10001}"
  init: true
  read_only: true
  restart: unless-stopped
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777

services:
  gateway:
    image: nginx:stable-alpine
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-8000}:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - download-browser
      - media
  web:
    <<: *foxden-service
    mem_limit: "${WEB_MEMORY_LIMIT:-768m}"
    command: ["foxden-music-web"]
    environment:
      <<: *foxden-environment
      # The web process gets an ephemeral placeholder, never the host library.
      MUSIC_DIR: /tmp/foxden-web-no-library
      WEB_HOST: 0.0.0.0
      WEB_PORT: "8000"
      WEB_WORKERS: "1"
      # Starlette may spool multipart uploads before the intake handler streams
      # them. Keep that disk-backed and bounded by the staging filesystem rather
      # than consuming the container's deliberately small /tmp tmpfs.
      TMPDIR: /staging/.upload-tmp
      # Environment-backed Compose secrets cannot mount into read-only services.
      CSRF_SECRET: "${CSRF_SECRET:-}"
    expose:
      - "8000"
    volumes:
      - type: bind
        source: "${CONFIG_PATH:-./data/config}"
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: "${STAGING_PATH:-./data/staging}"
        target: /staging
        bind:
          create_host_path: false
      - type: bind
        source: "${DOWNLOAD_INBOX_PATH:-./data/download-inbox}"
        target: /downloads
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-m", "foxden_music.healthcheck", "web"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 20s

  worker:
    <<: *foxden-service
    mem_limit: "${WORKER_MEMORY_LIMIT:-1g}"
    command: ["foxden-music-worker"]
    environment:
      <<: *foxden-environment
      MUSIC_DIR: /music
      WORKER_POLL_SECONDS: "${WORKER_POLL_SECONDS:-2}"
      LIBRARY_SCAN_INTERVAL_SECONDS: "${LIBRARY_SCAN_INTERVAL_SECONDS:-21600}"
      STORAGE_SNAPSHOT_INTERVAL_SECONDS: "${STORAGE_SNAPSHOT_INTERVAL_SECONDS:-900}"
      INVENTORY_COMMIT_BATCH_SIZE: "${INVENTORY_COMMIT_BATCH_SIZE:-50}"
      WORKER_HEARTBEAT_PATH: /tmp/foxden-music-worker-heartbeat.json
      WORKER_HEARTBEAT_MAX_AGE_SECONDS: "${WORKER_HEARTBEAT_MAX_AGE_SECONDS:-120}"
      JELLYFIN_URL: "${JELLYFIN_URL:-}"
      JELLYFIN_API_KEY: "${JELLYFIN_API_KEY:-}"
      JELLYFIN_TIMEOUT_SECONDS: "${JELLYFIN_TIMEOUT_SECONDS:-15}"
    volumes:
      - type: bind
        source: "${CONFIG_PATH:-./data/config}"
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: "${STAGING_PATH:-./data/staging}"
        target: /staging
        bind:
          create_host_path: false
      - type: bind
        source: "${DOWNLOAD_INBOX_PATH:-./data/download-inbox}"
        target: /downloads
        bind:
          create_host_path: false
      - type: bind
        source: "${MUSIC_PATH:-./data/music}"
        target: /music
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-m", "foxden_music.healthcheck", "worker"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 1m

  download-browser:
    image: jlesage/firefox:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      USER_ID: "${PUID:-10001}"
      GROUP_ID: "${PGID:-10001}"
      TZ: "${TZ:-America/New_York}"
      KEEP_APP_RUNNING: "1"
      DARK_MODE: "1"
      FF_OPEN_URL: "${SPOTIDOWNLOADER_URL:-https://spotidownloader.com/}"
      FF_KIOSK: "${REMOTE_BROWSER_KIOSK:-0}"
      FF_PREF_HOMEPAGE: 'browser.startup.homepage="${SPOTIDOWNLOADER_URL:-https://spotidownloader.com/}"'
      FF_PREF_STARTUP_PAGE: "browser.startup.page=1"
      FF_PREF_DISABLE_SESSION_RESTORE: "browser.sessionstore.resume_from_crash=false"
      FF_PREF_NEW_WINDOWS_AS_TABS: "browser.link.open_newwindow=3"
      FF_PREF_SCRIPT_WINDOWS_AS_TABS: "browser.link.open_newwindow.restriction=0"
      FF_PREF_EXTERNAL_LINKS_AS_TABS: "browser.link.open_newwindow.override.external=3"
      FF_PREF_DOWNLOAD_DIR: 'browser.download.dir="/downloads"'
      FF_PREF_DOWNLOAD_FOLDER: "browser.download.folderList=2"
      FF_PREF_USE_DOWNLOAD_DIR: "browser.download.useDownloadDir=true"
    expose: ["5800"]
    volumes:
      - type: bind
        source: "${BROWSER_CONFIG_PATH:-./data/browser-config}"
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: "${DOWNLOAD_INBOX_PATH:-./data/download-inbox}"
        target: /downloads
        bind:
          create_host_path: false
    stop_grace_period: 30s

  media:
    build:
      context: .
      args:
        APP_UID: "${PUID:-10001}"
        APP_GID: "${PGID:-10001}"
    image: fox-den-media:0.4.1
    user: "${PUID:-10001}:${PGID:-10001}"
    init: true
    read_only: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    environment:
      CONFIG_DIR: /config
      STAGING_DIR: /staging
      MEDIA_DIR: /media
      APP_TOKEN: "${APP_TOKEN:?Set a random APP_TOKEN of at least 24 characters}"
      QBIT_URL: "${QBIT_URL:-http://gluetun:${QBIT_WEB_PORT:-8080}}"
      QBIT_PUBLIC_URL: "${QBIT_PUBLIC_URL:-}"
      QBIT_USERNAME: "${QBIT_USERNAME:-admin}"
      QBIT_PASSWORD: "${QBIT_PASSWORD:-}"
      QBIT_DOWNLOAD_ROOT: "${QBIT_DOWNLOAD_ROOT:-/downloads}"
      MEDIA_BROWSER_HOME_URL: "${MEDIA_BROWSER_HOME_URL:-https://www.themoviedb.org/}"
      FULL_DECODE: "${FULL_DECODE:-true}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      SETTLE_SECONDS: "${SETTLE_SECONDS:-3}"
      DECODE_TIMEOUT: "${DECODE_TIMEOUT:-14400}"
    volumes:
      - type: bind
        source: "${MEDIA_CONFIG_PATH:-./data/media-config}"
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: "${TORRENT_STAGING_PATH:-./data/torrents}"
        target: /staging
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: "${MEDIA_PATH:-./data/media}"
        target: /media
        bind: {create_host_path: false}
    expose: ["8010"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
    stop_grace_period: 30s

  gluetun:
    image: "${GLUETUN_IMAGE:-qmcgaw/gluetun:v3.41.1}"
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    ports:
      - "${QBIT_BIND_IP:-127.0.0.1}:${QBIT_WEB_PORT:-8080}:${QBIT_WEB_PORT:-8080}/tcp"
    volumes:
      - type: bind
        source: "${GLUETUN_CONFIG_PATH:-./data/gluetun}"
        target: /gluetun
        bind: {create_host_path: false}
    secrets: [proton_wireguard_private_key]
    environment:
      TZ: "${TZ:-America/New_York}"
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY_SECRETFILE: /run/secrets/proton_wireguard_private_key
      WIREGUARD_ADDRESSES: "${WIREGUARD_ADDRESSES:-10.2.0.2/32}"
      WIREGUARD_PUBLIC_KEY: "${WIREGUARD_PUBLIC_KEY:?Configure your VPN peer public key}"
      WIREGUARD_ENDPOINT_IP: "${WIREGUARD_ENDPOINT_IP:?Configure your VPN endpoint}"
      WIREGUARD_ENDPOINT_PORT: "${WIREGUARD_ENDPOINT_PORT:-51820}"
      WIREGUARD_ALLOWED_IPS: 0.0.0.0/0
      WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL: 25s
      FIREWALL_INPUT_PORTS: "${QBIT_WEB_PORT:-8080}"
      VPN_PORT_FORWARDING: "${VPN_PORT_FORWARDING:-off}"
      VPN_PORT_FORWARDING_PROVIDER: protonvpn
      VPN_PORT_FORWARDING_PORTS_COUNT: "1"
      VPN_PORT_FORWARDING_UP_COMMAND: >-
        /bin/sh -c 'wget -O- -nv --retry-connrefused
        --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}"
        http://127.0.0.1:${QBIT_WEB_PORT:-8080}/api/v2/app/setPreferences'
      VPN_PORT_FORWARDING_DOWN_COMMAND: >-
        /bin/sh -c 'wget -O- -nv --retry-connrefused
        --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}"
        http://127.0.0.1:${QBIT_WEB_PORT:-8080}/api/v2/app/setPreferences'
    restart: unless-stopped
  qbittorrent:
    image: "${QBIT_IMAGE:-lscr.io/linuxserver/qbittorrent:latest}"
    network_mode: service:gluetun
    depends_on:
      gluetun: {condition: service_healthy}
    environment:
      PUID: "${PUID:-10001}"
      PGID: "${PGID:-10001}"
      TZ: "${TZ:-America/New_York}"
      UMASK: "002"
      WEBUI_PORT: "${QBIT_WEB_PORT:-8080}"
    volumes:
      - type: bind
        source: "${TORRENT_CONFIG_PATH:-./data/qbittorrent}"
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: "${TORRENT_STAGING_PATH:-./data/torrents}"
        target: /downloads
        bind: {create_host_path: false}
    stop_grace_period: 30s
    restart: unless-stopped

secrets:
  proton_wireguard_private_key:
    file: "${WIREGUARD_PRIVATE_KEY_FILE:-./secrets/proton-wireguard-private-key.txt}"
