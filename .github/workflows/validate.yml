name: Validate Fox Den Media
on:
  push:
    branches: [dev, main, master]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements-dev.txt -r music/backend/requirements-dev.txt
      - name: Movie and TV workflow tests
        run: python -m pytest tests -q
      - name: Music regression tests
        env:
          PYTHONPATH: music/backend/src
        run: python -m pytest -c music/backend/pyproject.toml music/backend/tests -q
      - name: JavaScript syntax
        run: node --check app/static/app.js
      - name: Compose validation
        env:
          APP_TOKEN: ci-only-token-at-least-24-characters
          WIREGUARD_PUBLIC_KEY: example-only
          WIREGUARD_ENDPOINT_IP: 192.0.2.10
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.vpn.yaml config --quiet
      - name: Build application images
        env:
          APP_TOKEN: ci-only-token-at-least-24-characters
        run: docker compose -f compose.yaml build media web
