name: Fox Den CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      strict:
        description: Run main-level release checks on the selected branch
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Repository and JavaScript checks
        run: |
          python ci/check_repository.py
          python -m compileall -q backend/src backend/tests ci
          node --check backend/src/foxden_music/static/app.js
          node --check backend/src/foxden_music/static/browser.js
          node --input-type=module --check < backend/src/foxden_music/static/browser-home-bridge.js
          docker compose --env-file .env.example -f docker-compose.yaml config --quiet
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  tests:
    name: Tests
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install application and test dependencies
        run: |
          python -m pip install -r backend/requirements-dev.txt
          python -m pip install --no-deps -e backend
          python -m pip check
      - name: Unit and regression tests
        run: python -m pytest backend/tests ci/test_gates.py -m 'not integration' --junitxml=reports/dev.xml --cov=foxden_music --cov-report=xml:reports/coverage.xml
      - name: Reject unexpected Linux skips
        run: python ci/check_test_report.py reports/dev.xml
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-test-reports
          path: reports/
          retention-days: 14

  packaging:
    name: Packaging and container smoke
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build installable wheel
        run: python -m pip wheel --no-deps --wheel-dir dist ./backend
      - name: Build actual deployment image
        run: docker build --tag foxden-ci:local backend
      - name: Boot non-root web and worker, check packaged assets
        run: python ci/container_smoke.py
      - name: Package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fox-den-music-dev-package
          path: dist/
          retention-days: 14

  dev-gate:
    name: Dev gate
    if: always()
    needs: [validation, tests, packaging]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every development layer to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python -c 'import json,os; r=json.loads(os.environ["RESULTS"]); assert all(j["result"]=="success" for j in r.values()), r'

  release-tests:
    name: Release tests (Python ${{ matrix.python }})
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main' || github.event.merge_group.base_ref == 'refs/heads/main' || inputs.strict == true
    needs: dev-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install real audio tooling and application
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r backend/requirements-dev.txt
          python -m pip install --no-deps -e backend
          python -m pip check
      - name: All tests with real audio and minimum coverage
        run: python -m pytest backend/tests ci/test_gates.py --junitxml=reports/release.xml --cov=foxden_music --cov-report=xml:reports/coverage.xml --cov-fail-under=80
      - name: Reject unexpected skips
        run: python ci/check_test_report.py reports/release.xml
      - name: Release test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-python-${{ matrix.python }}
          path: reports/
          retention-days: 14

  browser:
    name: Desktop and mobile browsers
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main' || github.event.merge_group.base_ref == 'refs/heads/main' || inputs.strict == true
    needs: dev-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install application and browsers
        run: |
          python -m pip install -r backend/requirements.txt -r ci/requirements.txt
          python -m pip install --no-deps -e backend
          python -m playwright install --with-deps chromium webkit
      - name: Exercise UI in isolated workspace
        run: python ci/browser_smoke.py
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-screenshots
          path: reports/
          retention-days: 14

  dependency-audit:
    name: Dependency vulnerability audit
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main' || github.event.merge_group.base_ref == 'refs/heads/main' || inputs.strict == true
    needs: dev-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.9.0
      - name: Audit runtime dependency resolution
        run: |
          mkdir -p reports
          python -m pip_audit -r backend/requirements.txt --format json --output reports/dependency-audit.json
      - name: Audit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit
          path: reports/
          retention-days: 14

  main-gate:
    name: Main gate
    if: always() && (github.base_ref == 'main' || github.ref == 'refs/heads/main' || github.event.merge_group.base_ref == 'refs/heads/main' || inputs.strict == true)
    needs: [dev-gate, release-tests, browser, dependency-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every release layer to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python -c 'import json,os; r=json.loads(os.environ["RESULTS"]); assert all(j["result"]=="success" for j in r.values()), r'
