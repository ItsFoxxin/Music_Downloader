worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Variable targets defer Docker DNS resolution until a route is used, so a
    # missing optional module cannot prevent ingress or Portal startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        server_name _;
        absolute_redirect off;
        client_max_body_size 0;
        client_body_timeout 3600s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;

        location @portal_login { return 302 /login; }
        location @module_unavailable {
            default_type text/plain;
            return 503 "Module unavailable\n";
        }
        location @auth_unavailable {
            default_type text/plain;
            return 503 "Authentication unavailable\n";
        }

        location = /_foxden_portal_auth {
            internal;
            set $portal_backend portal:8020;
            proxy_pass http://$portal_backend/api/platform/v1/session;
            proxy_pass_request_body off;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
            proxy_send_timeout 2s;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host $http_host;
            proxy_set_header X-FoxDen-Ingress "1";
            proxy_set_header X-FoxDen-Identity "";
            proxy_set_header X-Authentik-Username "";
            proxy_set_header X-Authentik-Groups "";
            proxy_set_header X-Authentik-Email "";
            proxy_set_header X-Authentik-Uid "";
            proxy_set_header X-Authentik-Jwt "";
        }

        location = /_foxden_music_auth {
            internal;
            set $portal_backend portal:8020;
            proxy_pass http://$portal_backend/api/platform/v1/session?audience=music;
            proxy_pass_request_body off;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
            proxy_send_timeout 2s;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host $http_host;
            proxy_set_header X-FoxDen-Ingress "1";
            proxy_set_header X-FoxDen-Identity "";
            proxy_set_header X-Authentik-Username "";
            proxy_set_header X-Authentik-Groups "";
            proxy_set_header X-Authentik-Email "";
            proxy_set_header X-Authentik-Uid "";
            proxy_set_header X-Authentik-Jwt "";
        }

        location = /_foxden_media_auth {
            internal;
            set $portal_backend portal:8020;
            proxy_pass http://$portal_backend/api/platform/v1/session?audience=media;
            proxy_pass_request_body off;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
            proxy_send_timeout 2s;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host $http_host;
            proxy_set_header X-FoxDen-Ingress "1";
            proxy_set_header X-FoxDen-Identity "";
            proxy_set_header X-Authentik-Username "";
            proxy_set_header X-Authentik-Groups "";
            proxy_set_header X-Authentik-Email "";
            proxy_set_header X-Authentik-Uid "";
            proxy_set_header X-Authentik-Jwt "";
        }

        location = /music { return 302 /music/; }
        location /music/ {
            auth_request /_foxden_music_auth;
            auth_request_set $foxden_music_identity $upstream_http_x_foxden_identity;
            error_page 401 = @portal_login;
            error_page 500 = @auth_unavailable;
            error_page 502 503 504 = @module_unavailable;
            set $music_backend music:8000;
            rewrite ^/music/(.*)$ /$1 break;
            proxy_pass http://$music_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-FoxDen-Identity $foxden_music_identity;
            proxy_set_header X-FoxDen-Ingress "";
            proxy_set_header X-Authentik-Username "";
            proxy_set_header X-Authentik-Groups "";
            proxy_set_header X-Authentik-Email "";
            proxy_set_header X-Authentik-Uid "";
            proxy_set_header X-Authentik-Jwt "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /media { return 302 /media/; }
        location /media/ {
            auth_request /_foxden_media_auth;
            auth_request_set $foxden_media_identity $upstream_http_x_foxden_identity;
            error_page 401 = @portal_login;
            error_page 500 = @auth_unavailable;
            error_page 502 503 504 = @module_unavailable;
            set $media_backend media:8010;
            rewrite ^/media/(.*)$ /$1 break;
            proxy_pass http://$media_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-FoxDen-Identity $foxden_media_identity;
            proxy_set_header X-FoxDen-Ingress "";
            proxy_set_header X-Authentik-Username "";
            proxy_set_header X-Authentik-Groups "";
            proxy_set_header X-Authentik-Email "";
            proxy_set_header X-Authentik-Uid "";
            proxy_set_header X-Authentik-Jwt "";
            proxy_read_timeout 120s;
        }

        location = /server-browser { return 302 /server-browser/; }
        location /server-browser/ {
            auth_request /_foxden_portal_auth;
            error_page 401 = @portal_login;
            error_page 502 503 504 = @module_unavailable;
            set $browser_backend download-browser:5800;
            rewrite ^/server-browser/(.*)$ /$1 break;
            proxy_pass http://$browser_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-FoxDen-Identity "";
            proxy_set_header X-FoxDen-Ingress "";
            proxy_set_header X-Authentik-Username "";
            proxy_set_header X-Authentik-Groups "";
            proxy_set_header X-Authentik-Email "";
            proxy_set_header X-Authentik-Uid "";
            proxy_set_header X-Authentik-Jwt "";
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Portal owns the platform root and remains independent of every module.
        location / {
            set $portal_backend portal:8020;
            proxy_pass http://$portal_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-FoxDen-Identity "";
            proxy_set_header X-FoxDen-Ingress "";
            proxy_set_header X-Authentik-Username "";
            proxy_set_header X-Authentik-Groups "";
            proxy_set_header X-Authentik-Email "";
            proxy_set_header X-Authentik-Uid "";
            proxy_set_header X-Authentik-Jwt "";
            proxy_buffering off;
            proxy_read_timeout 120s;
        }
    }
}
